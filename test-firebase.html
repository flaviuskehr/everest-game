<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .test-item {
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    .test-item.success {
      border-color: #27AE60;
      background: #e8f8f0;
    }
    .test-item.error {
      border-color: #E74C3C;
      background: #fee;
    }
    .test-item.pending {
      border-color: #F39C12;
      background: #fef9e7;
    }
    pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Firebase Configuration Test</h1>
  <p>Testing Firebase connection and authentication...</p>

  <div id="tests"></div>

  <script type="module">
    import { firebaseConfig } from './js/firebase-config.js';
    import {
      auth,
      database,
      signInAnonymously,
      ref,
      set,
      get,
      onValue
    } from './js/firebase.js';

    const testsEl = document.getElementById('tests');

    function addTest(name, status, message, details = null) {
      const div = document.createElement('div');
      div.className = `test-item ${status}`;
      div.innerHTML = `
        <h3>${status === 'success' ? '✓' : status === 'error' ? '✗' : '⏳'} ${name}</h3>
        <p>${message}</p>
        ${details ? `<pre>${details}</pre>` : ''}
      `;
      testsEl.appendChild(div);
    }

    async function runTests() {
      // Test 1: Config loaded
      try {
        addTest('Config Loaded', 'success', 'Firebase config loaded successfully',
          JSON.stringify(firebaseConfig, null, 2));
      } catch (error) {
        addTest('Config Loaded', 'error', 'Failed to load config', error.message);
        return;
      }

      // Test 2: Anonymous Auth
      try {
        addTest('Anonymous Auth', 'pending', 'Attempting anonymous sign-in...');
        const userCredential = await signInAnonymously(auth);
        const uid = userCredential.user.uid;

        // Update the pending test
        testsEl.lastChild.remove();
        addTest('Anonymous Auth', 'success', `Signed in anonymously`, `UID: ${uid}`);
      } catch (error) {
        testsEl.lastChild.remove();
        addTest('Anonymous Auth', 'error', 'Anonymous sign-in failed', error.message);
        return;
      }

      // Test 3: Database Write (presence)
      try {
        addTest('Database Write', 'pending', 'Writing to database...');
        const testRef = ref(database, `presence/test/${auth.currentUser.uid}`);
        await set(testRef, true);

        testsEl.lastChild.remove();
        addTest('Database Write', 'success', 'Successfully wrote to database',
          `Path: presence/test/${auth.currentUser.uid}`);
      } catch (error) {
        testsEl.lastChild.remove();
        addTest('Database Write', 'error', 'Database write failed',
          `${error.message}\n\nCheck that database rules are deployed in Firebase Console.`);
        return;
      }

      // Test 4: Database Read
      try {
        addTest('Database Read', 'pending', 'Reading from database...');
        const testRef = ref(database, `presence/test/${auth.currentUser.uid}`);
        const snapshot = await get(testRef);

        testsEl.lastChild.remove();
        if (snapshot.exists()) {
          addTest('Database Read', 'success', 'Successfully read from database',
            `Value: ${snapshot.val()}`);
        } else {
          addTest('Database Read', 'error', 'Read succeeded but no data found',
            'The write may have failed or rules may be blocking reads.');
        }
      } catch (error) {
        testsEl.lastChild.remove();
        addTest('Database Read', 'error', 'Database read failed', error.message);
        return;
      }

      // Test 5: Real-time listener
      try {
        addTest('Real-time Listener', 'pending', 'Testing real-time updates...');
        const testRef = ref(database, `presence/test/${auth.currentUser.uid}`);

        let listenerFired = false;
        onValue(testRef, (snapshot) => {
          if (!listenerFired) {
            listenerFired = true;
            testsEl.lastChild.remove();
            addTest('Real-time Listener', 'success', 'Real-time listener working',
              `Received value: ${snapshot.val()}`);
          }
        });

        // Trigger an update
        setTimeout(() => {
          set(testRef, Date.now());
        }, 500);

      } catch (error) {
        testsEl.lastChild.remove();
        addTest('Real-time Listener', 'error', 'Real-time listener failed', error.message);
      }

      // Test 6: Vote simulation
      setTimeout(async () => {
        try {
          addTest('Vote Simulation', 'pending', 'Simulating a vote...');
          const voteRef = ref(database, `votes/test/testnode/1/${auth.currentUser.uid}`);
          await set(voteRef, 'A');

          testsEl.lastChild.remove();
          addTest('Vote Simulation', 'success', 'Vote recorded successfully',
            `Path: votes/test/testnode/1/${auth.currentUser.uid}\nValue: A`);
        } catch (error) {
          testsEl.lastChild.remove();
          addTest('Vote Simulation', 'error', 'Vote failed',
            `${error.message}\n\nThis might mean the session is not open or rules are incorrect.`);
        }

        // Final summary
        setTimeout(() => {
          const successCount = document.querySelectorAll('.test-item.success').length;
          const errorCount = document.querySelectorAll('.test-item.error').length;

          const summary = document.createElement('div');
          summary.className = `test-item ${errorCount === 0 ? 'success' : 'error'}`;
          summary.innerHTML = `
            <h2>Test Summary</h2>
            <p><strong>${successCount}</strong> tests passed, <strong>${errorCount}</strong> tests failed</p>
            ${errorCount === 0 ?
              '<p>✓ Firebase is configured correctly! You can now test the full app.</p>' :
              '<p>✗ Some tests failed. Check the errors above and verify your Firebase setup.</p>'
            }
          `;
          testsEl.appendChild(summary);
        }, 1000);
      }, 1500);
    }

    runTests();
  </script>
</body>
</html>
