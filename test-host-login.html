<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Login Test</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
    .form-group { margin: 1rem 0; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input { width: 100%; padding: 0.75rem; font-size: 1rem; border: 2px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 0.75rem; font-size: 1rem; background: #E8743B; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #d66832; }
    .log { background: #f5f5f5; padding: 1rem; margin: 1rem 0; border-radius: 4px; }
    .error { background: #fee; color: #c33; }
    .success { background: #efe; color: #363; }
  </style>
</head>
<body>
  <h1>Host Login Test</h1>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Host Email</label>
      <input type="email" id="email" required placeholder="host@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit">Login</button>
  </form>

  <div id="logs"></div>

  <script type="module">
    import {
      auth,
      database,
      signInWithEmailAndPassword,
      ref,
      set
    } from './js/firebase.js';

    const logsEl = document.getElementById('logs');

    function log(message, type = 'log') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = message;
      logsEl.appendChild(div);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        log('Attempting to sign in...');
        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        log(`✓ Login successful!`, 'success');
        log(`User: ${userCredential.user.email}`, 'success');
        log(`UID: ${userCredential.user.uid}`, 'success');
        log(`Expected UID: YJ2QRWQRQDR55OlFlpY9blnjbsm2`);

        if (userCredential.user.uid === 'YJ2QRWQRQDR55OlFlpY9blnjbsm2') {
          log('✓ UID matches! This user can control the session.', 'success');
        } else {
          log('✗ UID does not match! Update database.rules.json with your actual UID.', 'error');
        }

        // Try to start a session
        log('Testing session write permission...');
        const sessionRef = ref(database, 'sessions/test');
        await set(sessionRef, {
          currentNode: 'intro',
          status: 'story',
          winner: null,
          round: 1,
          path: []
        });

        log('✓ Session write successful! You have correct permissions.', 'success');

      } catch (error) {
        log(`✗ Login failed: ${error.code}`, 'error');
        log(`Error message: ${error.message}`, 'error');
      }
    });
  </script>
</body>
</html>
