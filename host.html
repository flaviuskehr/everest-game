<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host - Everest, Together</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login screen -->
  <div class="login-container" id="loginContainer">
    <h1 class="login-title">Host Login</h1>
    <div id="loginError" class="error-message" style="display: none;"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-input" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
  </div>

  <!-- Host view (hidden until logged in) -->
  <div id="hostView" style="display: none;">
    <!-- Host controls -->
    <div class="host-controls" id="hostControls">
      <div class="host-header">
        <div class="session-info">
          <strong>Session:</strong> <span id="sessionCode"></span> |
          <strong>Node:</strong> <span id="currentNodeId">—</span> |
          <strong>Status:</strong> <span id="statusDisplay">—</span>
        </div>
        <button class="btn btn-outline" id="logoutBtn">Logout</button>
      </div>

      <div class="control-buttons" id="controlButtons">
        <!-- Dynamic buttons rendered here -->
      </div>

      <div class="qr-section" id="qrSection">
        <p><strong>Participants join at:</strong></p>
        <div id="qrCode" class="qr-code"></div>
        <div class="join-url" id="joinUrl"></div>
      </div>
    </div>

    <!-- Hero section -->
    <div class="hero" id="hero">
      <img class="hero-image" id="heroImage" alt="" loading="eager">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title" id="nodeTitle">Everest, Together</h1>
        <p class="hero-subtitle" id="nodeSubtitle">Loading…</p>
      </div>
      <div class="image-credit" id="imageCredit"></div>
    </div>

    <!-- Main content -->
    <div class="container">
      <!-- Story text -->
      <div class="story-text" id="storyText" role="article"></div>

      <!-- Question section -->
      <div class="question-section" id="questionSection" style="display: none;">
        <p class="question-text" id="questionText"></p>
        <div id="liveVoteCount" style="text-align: center; margin: 2rem 0; font-size: 1.25rem; color: var(--text-muted);"></div>
      </div>

      <!-- Results section -->
      <div class="results" id="resultsSection" style="display: none;"></div>

      <!-- Summary section -->
      <div class="summary" id="summarySection" style="display: none;"></div>
    </div>
  </div>

  <script type="module" src="js/app-host.js"></script>
</body>
</html>
